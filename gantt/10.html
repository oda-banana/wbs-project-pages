min-width:var(--label);position:sticky;left:0;z-index:3;display:flex;align-items:center;gap:7px;background:var(--bg);border-right:2px solid #c5ccda;padding-right:9px;overflow:hidden}.g-row.group .row-label{background:var(--soft)}.g-row.depth-0 .row-label,.g-row.depth-0 .track{background-color:var(--tint)}.g-row.depth-0 .row-label{border-left:4px solid var(--accent)}.g-row:hover .row-label{background:var(--tint)}.toggle-row{padding:0;border:0;background:transparent;font-size:12px;color:var(--muted);width:20px;flex-shrink:0}.row-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;padding:0;text-align:left;flex:1;min-width:20px}.group .row-name{font-weight:650}.depth-1 .row-name{font-size:14px}.check .row-name{font-size:11px;color:var(--muted)}.axis{font-size:10px;line-height:1.7;padding:0 6px;color:#fff;border-radius:5px;flex-shrink:0}.count{color:var(--muted);font-size:10px;border-radius:5px;background:var(--soft);padding:1px 5px}.owner{max-width:91px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:5px;font-size:10px;padding:1px 5px;color:var(--muted);flex-shrink:0}.track{position:relative;flex-shrink:0;height:100%;overflow:hidden}.bar{position:absolute;top:8px;height:19px;min-width:3px;border:0;border-radius:4px;padding:0;overflow:hidden;color:#fff;background:#94a3b8;text-align:left;box-shadow:inset 0 0 0 1px #0001}.bar .progress-fill{height:100%;position:absolute;left:0;top:0;background:#fff4;pointer-events:none}.bar .bar-caption{position:relative;font-size:10px;line-height:19px;padding:0 6px;white-space:nowrap}.bar.actual{top:29px;height:4px;background:#16a34a;min-width:3px}.bar.summary{height:7px;top:15px;opacity:.65;border-radius:2px}.date-note{position:sticky;left:calc(var(--label) + 10px);display:inline-block;margin-top:10px;font-size:10px;color:var(--muted);white-space:nowrap}.today-line{position:absolute;top:0;bottom:0;border-left:1px dashed #ef476f <main class="app">
<header class="top">
<nav class="nav"><a href="../index.html">← 進捗ポータル・システム一覧</a></nav>
<div class="toolbar">
  <div class="heading"><h1>WBS ガントチャート</h1><div class="subtitle" id="subtitle"></div></div>
  <button class="primary" id="reset">↻ フィルターをリセット</button>
  <button id="expand">展開</button><button id="collapse">折りたたみ</button>
  <button id="filterToggle" aria-expanded="true" aria-controls="filters">フィルター ▾</button>
  <input class="search" type="search" id="search" aria-label="タスク名・機能ID・担当者を検索" placeholder="タスク名・機能ID・担当者で検索">
  <label class="toggle"><input type="checkbox" id="showTest" checked>テスト工程を表示</label>
</div>
<div class="toolbar second">
  <div class="zoom" role="group" aria-label="表示倍率"><button data-zoom="7" aria-pressed="false">極小</button><button data-zoom="13" aria-pressed="false">小</button><button data-zoom="24" aria-pressed="true">標準</button><button data-zoom="36" aria-pressed="false">大</button></div>
  <button id="export">CSV出力</button><button id="theme" aria-label="配色を切り替え">☾</button>
  <div id="stats" class="stats" aria-live="polite"></div>
</div>
</header>
<section class="filters" id="filters" aria-label="絞り込み">
  <div class="filter-row"><span class="filter-name">表示期間</span><div class="range"><label>開始 <input type="date" id="from"></label><span>〜</span><label>終了 <input type="date" id="to"></label><button class="mini" id="allDates">全期間表示</button><button class="mini" id="today">今日へ</button><span class="hint" id="rangeHint">横軸の範囲です。期間外・日付未設定のタスクも一覧に残ります。</span></div></div>
  <div class="filter-row"><span class="filter-name">担当者</span><button class="mini" id="ownersAll">全選択</button><button class="mini" id="ownersNone">全解除</button><div class="chips" id="owners"></div></div>
  <div class="filter-row"><span class="filter-name">ステータス</span><button class="mini" id="statusAll">全選択</button><button class="mini" id="statusNone">全解除</button><div class="chips" id="statuses"></div></div>
  <div class="filter-row"><span class="filter-name">表示項目</span><label class="toggle"><input type="checkbox" id="showChecks">チェック項目を表示</label><label class="toggle"><input type="checkbox" id="showExcluded">不要・リリース対象外も表示</label><span class="hint">チェック項目は親に内包されるため、件数・工数の集計に含めません。</span></div>
</section>
<div class="chart" id="chart" tabindex="0" aria-label="WBS一覧と日別ガントチャート">
  <div class="chart-inner" id="chartInner"><div class="chart-header"><div class="header-label">タスク <small>▶ で詳細展開 ／ タスク名で情報表示</small></div><div class="time-header" id="timeHeader"></div></div><div class="rows" id="rows"></div></div>
</div>
<footer class="footer"><span><i class="legend-dot" style="background:#94a3b8"></i>未着手</span><span><i class="legend-dot" style="background:#3b82f6"></i>着手中</span><span><i class="legend-dot" style="background:#16a34a"></i>完了</span><span><i class="legend-dot" style="background:#e11d48"></i>遅延・不具合</span><span><i class="legend-line"></i>実績期間</span><span>細いバー＝配下の予定範囲（空き期間を含む）</span><span>閲覧専用・最新CSVから自動更新</span></footer>
</main>
<dialog id="detail"><button class="close" id="closeDetail">閉じる</button><div id="detailBody"></div></dialog>

<script>
(() => {
'use strict';
const DATA=JSON.parse(document.getElementById('page-data').textContent);
const TASKS=DATA.tasks, REAL=TASKS.filter(t=>!t.checklist), DAY=86400000;
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const day=s=>s?Date.parse(s+'T00:00:00Z')/DAY:null;
const iso=n=>new Date(n*DAY).toISOString().slice(0,10);
const unique=a=>[...new Set(a)].sort((a,b)=>a.localeCompare(b,'ja'));
const owner=t=>t.assignee||'（未アサイン）', status=t=>t.status||'（未設定）';
const owners=unique(REAL.map(owner)), statuses=unique(REAL.map(status));
const chosenOwners=new Set(owners), chosenStatuses=new Set(statuses), opened=new Map();
const children=new Map();
for(const t of TASKS.filter(t=>t.checklist&&t.parentId)){if(!children.has(t.parentId))children.set(t.parentId,[]);children.get(t.parentId).push(t);}
const today=day(DATA.today), holidays=new Set(DATA.holidays);
let px=24, rangeStart=today-30, rangeEnd=Math.max(today+90,day(DATA.target));
let flat=[], filtered=[], frame=0, renderedStart=-1, renderedEnd=-1;
let rowHeight=38, timelineWidth=0, gridBackground='', gridSize='', gridPosition='';
const chart=$('chart'), rowLayer=$('rows');
const late=t=>!t.done&&!t.excluded&&t.end&&day(t.end)<today;
const color=t=>t.excluded?'#b6bfcc':late(t)||t.status==='不具合発生'?'#e11d48':t.done?'#16a34a':t.active?'#3b82f6':t.status==='保留'?'#9b77d5':'#94a3b8';
const axisColor=axis=>({'画面':'#4558ff','API':'#963df2','帳票':'#099989','バッチ':'#d5891b'}[axis]||'#64748b');
const number=n=>n.toLocaleString('ja-JP',{maximumFractionDigits:1});
const validSpan=(s,e)=>s&&e&&day(s)<=day(e);
function labelHours(n){return n===null?'未設定':number(n)+'h';}
function matchesQuery(t,q){return [t.id,t.name,t.feature,t.assignee,t.phase,t.phaseLabel,t.status].join(' ').toLowerCase().includes(q);}
function getFiltered(){
  const q=$('search').value.trim().toLowerCase();
  return REAL.filter(t=>chosenOwners.has(owner(t))&&chosenStatuses.has(status(t))&&
    ($('showTest').checked||!t.test)&&($('showExcluded').checked||!t.excluded)&&
    (!q||matchesQuery(t,q)||($('showChecks').checked&&(children.get(t.id)||[]).some(c=>matchesQuery(c,q)))));
}
function chipGroup(id,values,selected,field){
  const container=$(id);container.replaceChildren();
  for(const value of values){
    const b=el('button','chip',value);b.type='button';b.setAttribute('aria-pressed',selected.has(value));
    b.append(el('small','',REAL.filter(t=>field(t)===value).length));
    b.addEventListener('click',()=>{selected.has(value)?selected.delete(value):selected.add(value);chipGroup(id,values,selected,field);rebuild();});container.append(b);
  }
}
function refreshChips(){chipGroup('owners',owners,chosenOwners,owner);chipGroup('statuses',statuses,chosenStatuses,status);}
function addStat(label,value,cls=''){const n=el('span',cls,label);n.append(el('strong','',value));$('stats').append(n);}
function summary(){
  $('stats').replaceChildren();addStat('表示中',`${filtered.length} / ${REAL.length} 件`);
  addStat('完了',filtered.filter(t=>t.done).length,'done');addStat('着手中',filtered.filter(t=>t.active).length,'active');
  addStat('遅延',filtered.filter(late).length,'late');addStat('予定工数',number(filtered.reduce((s,t)=>s+(t.est??0),0))+'h');
  addStat('実績工数',number(filtered.reduce((s,t)=>s+(t.actual??0),0))+'h');
  addStat('予定日不足',filtered.filter(t=>!validSpan(t.start,t.end)).length+'件');
  const noEstimate=filtered.filter(t=>t.est===null).length;if(noEstimate)addStat('見積未設定',noEstimate+'件');
}
function group(key,label,depth,axis=''){return {key,label,depth,axis,kind:'group',items:[],children:[],lookup:new Map()};}
function subgroup(parent,key,label,axis=''){
  if(!parent.lookup.has(key)){const n=group(parent.key+'/'+key,label,parent.depth+1,axis);parent.lookup.set(key,n);parent.children.push(n);}
  return parent.lookup.get(key);
}
function taskNode(t,depth){return {key:'task/'+t.id,label:t.name,depth,kind:'task',task:t,items:t.checklist?[]:[t],children:[]};}
function tree(){
  const root=group('root',DATA.system,0);
  for(const t of filtered){
    const feature=subgroup(root,JSON.stringify(t.base),t.base);
    const suffix=t.feature!==t.base?t.feature.slice(t.base.length).replace(/^_/,''):'';
    const unit=subgroup(feature,JSON.stringify([t.feature,t.axis]),suffix||t.axis,t.axis);
    const phase=subgroup(unit,JSON.stringify(t.phaseLabel),t.phaseLabel,t.axis);
    for(const n of [root,feature,unit,phase])n.items.push(t);
    const task=taskNode(t,4);phase.children.push(task);
    if($('showChecks').checked)task.children=(children.get(t.id)||[]).map(c=>taskNode(c,5));
  }
  // 孤立チェック項目も表示できるようにする。集計には含めない。
  if($('showChecks').checked){
    const q=$('search').value.trim().toLowerCase();
    for(const t of TASKS.filter(t=>t.checklist&&!t.parentId)){
      if(q&&!matchesQuery(t,q)||!$('showTest').checked&&t.test||!$('showExcluded').checked&&t.excluded)continue;
      if(!(chosenOwners.size===owners.length||chosenOwners.has(owner(t)))||
         !(chosenStatuses.size===statuses.length||chosenStatuses.has(status(t))))continue;
      const f=subgroup(root,JSON.stringify(t.base),t.base);
      const u=subgroup(f,JSON.stringify([t.feature,t.axis]),t.axis,t.axis);
      const p=subgroup(u,JSON.stringify(t.phaseLabel),t.phaseLabel,t.axis);p.children.push(taskNode(t,4));
    }
  }
  return root;
}
function isOpen(n){return opened.has(n.key)?opened.get(n.key):n.depth<3;}
function flatten(n){flat.push(n);if(n.children.length&&isOpen(n))for(const c of n.children)flatten(c);}
function rebuild(){
  filtered=getFiltered();summary();flat=[];const root=tree();if(root.children.length)flatten(root);
  rowLayer.style.height=(flat.length?flat.length*rowHeight:120)+'px';renderedStart=renderedEnd=-1;paintRows(true);
}
function toggleNode(n){opened.set(n.key,!isOpen(n));rebuild();}
function setAll(open){const visit=n=>{opened.set(n.key,open);n.children.forEach(visit);};visit(tree());rebuild();}
function makeTimeline(){
  const count=rangeEnd-rangeStart+1;timelineWidth=count*px;
  const labelWidth=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--label'));
  $('chartInner').style.width=(timelineWidth+labelWidth)+'px';const header=$('timeHeader');header.style.width=timelineWidth+'px';header.replaceChildren();
  let monthStart=rangeStart;
  for(let n=rangeStart;n<=rangeEnd;n++){
    const s=iso(n), d=new Date(n*DAY), weekday=d.getUTCDay(), x=(n-rangeStart)*px;
    if(n===rangeEnd||iso(n+1).slice(0,7)!==s.slice(0,7)){
      const m=el('div','month',s.slice(0,4)+'年 '+Number(s.slice(5,7))+'月');m.style.left=(monthStart-rangeStart)*px+'px';m.style.width=(n-monthStart+1)*px+'px';header.append(m);monthStart=n+1;
    }
    const cell=el('div','day'+(weekday===0?' sun':weekday===6?' sat':'')+(holidays.has(s)?' holiday':'')+(n===today?' today':''),px>=13||weekday===1?d.getUTCDate():'');
    cell.style.left=x+'px';cell.style.width=px+'px';cell.title=s+(holidays.has(s)?'（祝日）':'');header.append(cell);
  }
  const offset=(new Date(rangeStart*DAY).getUTCDay()+6)%7;
  gridBackground='linear-gradient(90deg, var(--line) 1px, transparent 1px),linear-gradient(90deg, transparent '+(5*px)+'px, var(--weekend) '+(5*px)+'px)';
  gridSize=px+'px 100%,'+(7*px)+'px 100%';gridPosition='0 0,'+(-offset*px)+'px 0';
  // 祝日は各行へDOMを追加せず、背景として共有する。
  for(const h of holidays){const n=day(h);if(n>=rangeStart&&n<=rangeEnd){const left=(n-rangeStart)*px;gridBackground=`linear-gradient(90deg, transparent ${left}px, var(--holiday) ${left}px, var(--holiday) ${left+px}px, transparent ${left+px}px),`+gridBackground;gridSize=timelineWidth+'px 100%,'+gridSize;gridPosition='0 0,'+gridPosition;}}
  renderedStart=renderedEnd=-1;paintRows(true);
}
function addBar(track,start,end,cls,paint,title,task){
  if(!validSpan(start,end))return;
  const a=Math.max(day(start),rangeStart), b=Math.min(day(end),rangeEnd);if(a>b)return;
  const bar=el(task?'button':'span','bar '+cls);bar.style.left=(a-rangeStart)*px+'px';bar.style.width=Math.max(3,(b-a+1)*px-2)+'px';bar.style.backgroundColor=paint;bar.title=title;
  if(task){bar.setAttribute('aria-label',title);bar.addEventListener('click',()=>detail(task));if(cls!=='actual'){
    const fill=el('span','progress-fill');fill.style.width=Math.min(100,Math.max(0,(task.done?1:task.progress??0)*100))+'%';bar.append(fill,el('span','bar-caption',owner(task)));}}
  track.append(bar);
}
function paintRow(n,index){
  const row=el('div',`g-row depth-${n.depth} ${n.kind}${n.task?.checklist?' check':''}`);row.style.top=index*rowHeight+'px';
  const label=el('div','row-label');label.style.paddingLeft=(10+Math.min(n.depth,4)*15)+'px';
  if(n.children.length){const toggle=el('button','toggle-row',isOpen(n)?'▼':'▶');toggle.setAttribute('aria-label',n.label+(isOpen(n)?'を折りたたむ':'を展開'));toggle.setAttribute('aria-expanded',isOpen(n));toggle.addEventListener('click',()=>toggleNode(n));label.append(toggle);}else label.append(el('span','toggle-row',n.task?.checklist?'┗':'·'));
  if(n.kind==='group'&&n.depth===3){const badge=el('span','axis',n.axis);badge.style.backgroundColor=axisColor(n.axis);label.append(badge);}
  const name=el('button','row-name',n.label);name.title=n.task?n.task.id+' / '+n.label:n.label;
  name.addEventListener('click',()=>n.task?detail(n.task):toggleNode(n));label.append(name);
  if(n.kind==='group'&&n.depth>=2)label.append(el('span','count',n.items.length+'件'));
  if(n.depth>=3){const people=unique(n.items.map(owner));const who=n.task?owner(n.task):people.length===1?people[0]:people.length+'名';const badge=el('span','owner',who);badge.title=n.task?owner(n.task):people.join('・');label.append(badge);}
  const track=el('div','track');track.style.width=timelineWidth+'px';track.style.backgroundImage=gridBackground;track.style.backgroundSize=gridSize;track.style.backgroundPosition=gridPosition;
  if(n.task){const t=n.task;addBar(track,t.start,t.end,'',color(t),`${t.id} ${t.name}\n予定 ${t.start} 〜 ${t.end}\n${owner(t)} / ${status(t)}`,t);
    addBar(track,t.actStart,t.actEnd,'actual','#16a34a',`${t.id} 実績 ${t.actStart} 〜 ${t.actEnd}`,t);
    if(!validSpan(t.start,t.end)&&!t.checklist){let text='予定日未設定';if(t.start&&t.end)text='予定日の逆転：詳細を確認';else if(t.start||t.end)text='予定日が一部未設定';track.append(el('span','date-note',text));}
  }else{
    const dates=n.items.filter(t=>validSpan(t.start,t.end));if(dates.length){const a=dates.map(t=>t.start).sort()[0],b=dates.map(t=>t.end).sort().at(-1);addBar(track,a,b,'summary',n.axis?axisColor(n.axis):'#8794b5',`配下の予定範囲 ${a} 〜 ${b}（空き期間を含む）`);}
  }
  if(today>=rangeStart&&today<=rangeEnd){const line=el('span','today-line');line.style.left=((today-rangeStart)*px+px/2)+'px';track.append(line);}
  row.append(label,track);return row;
}
function paintRows(force=false){
  if(!flat.length){rowLayer.replaceChildren(el('div','empty','該当するタスクはありません。フィルターをリセットして確認してください。'));return;}
  // 全展開時も可視行だけを描画し、大きいシステムのスクロールを軽くする。
  const first=Math.max(0,Math.floor((chart.scrollTop-58)/rowHeight)-10), last=Math.min(flat.length,first+Math.ceil(chart.clientHeight/rowHeight)+24);
  if(!force&&first===renderedStart&&last===renderedEnd)return;renderedStart=first;renderedEnd=last;
  const fragment=document.createDocumentFragment();for(let i=first;i<last;i++)fragment.append(paintRow(flat[i],i));rowLayer.replaceChildren(fragment);
}
function detail(t){
  const body=$('detailBody');body.replaceChildren(el('div','detail-id',t.id),el('h2','',t.name));const dl=el('dl');
  const fields=[['システム',DATA.system],['機能ID',t.feature||'未設定'],['工程',t.phaseLabel+' / '+t.phase],['担当者',owner(t)],['ステータス',status(t)],['開始予定',t.startRaw||'未設定'],['完了予定',t.endRaw||'未設定'],['実績開始',t.actStartRaw||'未設定'],['実績完了',t.actEndRaw||'未設定'],['予定工数',labelHours(t.est)],['実績工数',labelHours(t.actual)],['完了率',t.progress===null?'未設定':number(t.progress*100)+'%'],['依存タスク',t.depends||'なし'],['行の種類',t.checklist?'チェック項目（集計対象外）':'実タスク']];
  for(const [key,value]of fields)dl.append(el('dt','',key),el('dd','',value));body.append(dl);$('detail').showModal();
}
function applyRange(){
  const a=day($('from').value),b=day($('to').value);if(a===null||b===null||!Number.isFinite(a)||!Number.isFinite(b)||a>b){$('rangeHint').textContent='開始日・終了日を正しい順序で入力してください。';$('rangeHint').classList.add('error');return;}
  if(b-a>3660){$('rangeHint').textContent='表示期間は10年以内にしてください。タスク自体は一覧に残ります。';$('rangeHint').classList.add('error');return;}
  rangeStart=a;rangeEnd=b;$('rangeHint').textContent='横軸の範囲です。期間外・日付未設定のタスクも一覧に残ります。';$('rangeHint').classList.remove('error');chart.scrollLeft=0;makeTimeline();
}
function syncDates(){$('from').value=iso(rangeStart);$('to').value=iso(rangeEnd);}
function goToday(){chart.scrollLeft=Math.max(0,(today-rangeStart-3)*px);}
function csvCell(value){let s=String(value??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){
  const headings=['タスクID','システム','機能ID','工程','タスク名','担当者','ステータス','開始予定日','完了予定日','開始日','完了日','予定工数','実績工数','完了率'];
  const lines=[headings,...filtered.map(t=>[t.id,DATA.system,t.feature,t.phase,t.name,t.assignee,t.status,t.startRaw,t.endRaw,t.actStartRaw,t.actEndRaw,t.est,t.actual,t.progress])];
  const blob=new Blob(['\ufeff'+lines.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download='WBS_'+DATA.slug+'_'+DATA.today+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('subtitle').textContent=DATA.system+' ／ 実タスク '+REAL.length.toLocaleString()+'件 ／ 更新日 '+DATA.today;
refreshChips();syncDates();
$('search').addEventListener('input',()=>{chart.scrollTop=0;rebuild();});
for(const id of ['showTest','showChecks','showExcluded'])$(id).addEventListener('change',()=>{chart.scrollTop=0;rebuild();});
for(const id of ['from','to'])$(id).addEventListener('change',applyRange);
$('ownersAll').onclick=()=>{owners.forEach(v=>chosenOwners.add(v));refreshChips();rebuild();};
$('ownersNone').onclick=()=>{chosenOwners.clear();refreshChips();rebuild();};
$('statusAll').onclick=()=>{statuses.forEach(v=>chosenStatuses.add(v));refreshChips();rebuild();};
$('statusNone').onclick=()=>{chosenStatuses.clear();refreshChips();rebuild();};
$('expand').onclick=()=>setAll(true);$('collapse').onclick=()=>setAll(false);
$('filterToggle').onclick=()=>{const hidden=!$('filters').hidden;$('filters').hidden=hidden;$('filterToggle').setAttribute('aria-expanded',!hidden);$('filterToggle').textContent='フィルター '+(hidden?'▸':'▾');paintRows(true);};
if(window.matchMedia('(max-width:800px)').matches){$('filters').hidden=true;$('filterToggle').setAttribute('aria-expanded','false');$('filterToggle').textContent='フィルター ▸';}
$('allDates').onclick=()=>{const dates=TASKS.flatMap(t=>[t.start,t.end,t.actStart,t.actEnd]).filter(Boolean).map(day);rangeStart=Math.min(today,...dates);rangeEnd=Math.max(today,day(DATA.target),...dates);syncDates();applyRange();};
$('today').onclick=()=>{if(today<rangeStart||today>rangeEnd){rangeStart=today-30;rangeEnd=Math.max(today+90,day(DATA.target));syncDates();applyRange();}goToday();};
function zoom(value){const leftDay=chart.scrollLeft/px;px=value;document.querySelectorAll('[data-zoom]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.zoom)===px));makeTimeline();chart.scrollLeft=leftDay*px;}
document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoom(Number(b.dataset.zoom)));
$('reset').onclick=()=>{$('search').value='';chosenOwners.clear();owners.forEach(v=>chosenOwners.add(v));chosenStatuses.clear();statuses.forEach(v=>chosenStatuses.add(v));$('showTest').checked=true;$('showChecks').checked=false;$('showExcluded').checked=false;opened.clear();rangeStart=today-30;rangeEnd=Math.max(today+90,day(DATA.target));syncDates();refreshChips();chart.scrollTop=0;rebuild();zoom(24);applyRange();goToday();};
$('theme').onclick=()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';$('theme').textContent=root.dataset.theme==='dark'?'☀':'☾';};
$('export').onclick=exportCSV;$('closeDetail').onclick=()=>$('detail').close();
chart.addEventListener('scroll',()=>{if(!frame)frame=requestAnimationFrame(()=>{frame=0;paintRows();});});
new ResizeObserver(()=>{makeTimeline();}).observe(chart);
rebuild();makeTimeline();goToday();
})();
</script>
</body></html>
