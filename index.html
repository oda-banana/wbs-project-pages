<title>WBS進捗ポータル</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--border:#e1e4e8;--text:#20242c;--muted:#6b7280;--accent:#2f5fd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;padding:32px 18px}
main{max-width:880px;margin:0 auto}
h1{font-size:24px;margin:0 0 6px}
.updated{color:var(--muted);font-size:13px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card:focus-visible{outline:3px solid rgba(47,95,214,.3);outline-offset:2px}
.card strong{font-size:17px;color:var(--accent)}
.card span{font-size:13px;line-height:1.65;color:var(--muted)}
.note{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.7}
</style>
</head>
<body><main>
<h1>WBS進捗ポータル</h1>

</main></body>
</html>
